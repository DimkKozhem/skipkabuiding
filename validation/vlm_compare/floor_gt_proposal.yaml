    license: license_unresolved
    label_meaning: "multiple_level — RGB-значения, кратные 10, от 10 до 90. Загрузчик ждёт классы 0..12 и деления на 10 не делает. binary_level — те же пиксели без порядка, значения 0 и 10. semantic_label — другая маска, не этаж. Компоненты маски не считать этажами."
    building_id: "нет. В кадре несколько фасадов."
    splits: "train_data / val_data. real_data без разметки."
