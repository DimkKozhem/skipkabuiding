  - id: openfacades
    kind: floor_count_registry
    url: https://github.com/seshing/OpenFACADES
    paper: https://arxiv.org/abs/2504.02866
    label_meaning: "building:levels и другие поля OSM, плюс подписи VLM. Это не разметка видимых этажей на изображении."
    verdict: rejected_registry_or_generated_attribute
