    sample_overlay: artifacts/vlm_compare/window_benchmark_probe/cmp_b0001_windows_doors.jpg
    size: "606 выпрямленных фасадов, base+extended zip на сайте CMP."
    license: "страница ссылается на Creative Commons, точный код лицензии в скачанном readme не указан."
    label_meaning: "Прямоугольники: facade, window, door, cornice, sill, balcony, blind, deco, molding, pillar, shop, background. Этажа нет."
    building_id: "один выпрямленный фасад на кадр, без кадастрового id."
    splits: "CMP-base и CMP-extended, не train/test этажности."
    viewpoint: "rectified, фронтальный фасад."
    verdict: separate_window_door_benchmark_not_floor_count
  - id: ecp-etrims-paris
    kind: windows_and_doors
    note: "GATA2Floor оценивает на них окна. ECP URL из прошлой проверки CMP-страницы: http://vision.mas.ecp.fr/Personnel/teboul/data.php. eTRIMS: http://www.ipb.uni-bonn.de/projects/etrims_db/. Paris: https://github.com/raghudeep/ParisArtDecoFacadesDataset/. Этажные границы этих наборов в этом проходе не скачивались: у CMP уже есть открытые окна и двери."
    verdict: not_used_as_floor_gt
