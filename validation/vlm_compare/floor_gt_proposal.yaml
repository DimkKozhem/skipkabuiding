    kind: floor_count_manual_unreleased
    paper: https://arxiv.org/abs/2605.11863
    code: not_found
    label_meaning: "Авторы пишут, что вручную разметили число этажей на Amsterdam Facade, ECP, eTRIMS и Paris Art Deco. Файлов этой разметки нет. GitHub search GATA2Floor пустой."
