  - id: facade2floorcount
    kind: floor_count_unreleased
    url: https://github.com/Dobberzoon/Facade2Floorcount
    label_meaning: "README: код, ссылки и аннотации будут опубликованы, release pending."
    verdict: rejected_release_pending
