what_the_value_is:
  file_encoding: "RGB, каналы равны. Ненулевые значения только кратные 10: на val от 10 до 90. Ни один из 200 val не лежит в классах 1..12."
  val_images_per_value: {10: 200, 20: 200, 30: 200, 40: 187, 50: 145, 60: 70, 70: 39, 80: 6, 90: 1}
  train_sample: "30 из 800 train: те же кратные 10, максимум 70. Отдельной шкалы у train нет."
  loader: "datasets/FLNloader.py читает multiple_level как серый индекс и собирает one-hot для c in 0..12 условием label_line == c. Деления на 10 в загрузчике нет."
  attention: "Generate_Attention_GT и цикл в train() ищут строки, где пиксель равен k при k=0..12. Для этих файлов срабатывает фон 0 и значение 10. Значения 20 и выше в 13 каналов не попадают."
  loss: "loss.py — общий cross-entropy, унаследованный от HANet/Cityscapes. Отдельной функции «число этажей» нет. network/__init__.py задаёт голове 13 классов."
  evaluator: "Официального сравнения маски с геометрией нет. validate() считает Cityscapes IoU и требует число классов cityscapes. post_process() рисует линии по argmax и берёт номер из максимума маски; к файлам zip это сравнение не применяется. Закомментированное // 25 относится к другому имени _level.png, не к multiple_level."
  conclusion: "Значение — метка полосы в файле. Что оно кодирует: порядок, одну границу или иной признак — код не подтверждает. Перевод 10,20,30 в этажи не делать."
