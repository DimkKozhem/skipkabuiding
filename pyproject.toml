[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitewatch"
version = "0.1.0"
description = "Скрипка — контроль строительства: CV → ActualState → plan/fact → deviation → evidence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.5",
  "pyyaml>=6.0.2",
  "pillow>=11.0.0",
  "opencv-python-headless>=4.10.0",
  "python-multipart>=0.0.17",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
cv = ["ultralytics>=8.4.0"]
perception-sam = ["torch", "torchvision", "ultralytics>=8.3.0"]
perception-dino = []
perception-vl = ["httpx>=0.27.0"]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[project.scripts]
sitewatch = "sitewatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
